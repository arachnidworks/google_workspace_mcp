name: AW Sync Upstream (tested)

# Weekly: pull taylorwilsdon/google_workspace_mcp into this fork's main,
# run the same CI as upstream (ruff + pytest), and only push if green.
# Deploy to Cloud Run stays a human-gated step — this job just keeps the
# fork current and opens an issue when a new tested version is ready.

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC (~9am ET)
  workflow_dispatch: {} # allow manual runs

permissions:
  contents: write

concurrency:
  group: aw-sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/taylorwilsdon/google_workspace_mcp.git
          git fetch upstream main

      - name: Check how far behind upstream
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "main is $BEHIND commit(s) behind upstream/main"

      - name: Merge upstream onto main
        if: steps.check.outputs.behind != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Our only local change is this workflow file, which upstream never
          # touches, so this merge is clean. If it ever conflicts, the job
          # fails loudly (someone committed real changes to the fork).
          git merge --no-edit upstream/main

      - name: Install uv
        if: steps.check.outputs.behind != '0'
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        if: steps.check.outputs.behind != '0'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.check.outputs.behind != '0'
        run: uv sync --extra test --frozen

      - name: Ruff
        if: steps.check.outputs.behind != '0'
        run: uvx ruff check

      - name: Pytest
        if: steps.check.outputs.behind != '0'
        run: uv run pytest

      - name: Push updated main (tests passed)
        if: steps.check.outputs.behind != '0'
        run: git push origin main

      # Issues are disabled on this fork, so notify via the run summary.
      # GitHub also emails the workflow owner automatically on failure.
      - name: Report — ready to deploy
        if: steps.check.outputs.behind != '0'
        run: |
          VER=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          {
            echo "## ✅ Upstream synced to v${VER} — tested, ready to deploy"
            echo ""
            echo "Fork \`main\` was synced to upstream and passed ruff + pytest, then pushed."
            echo "Deploy to Cloud Run is **gated and manual** — follow the internal deploy runbook,"
            echo "then bump the \`google_workspace_mcp\` submodule pointer in aw-claude-mcps."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report — sync failed
        if: failure() && steps.check.outputs.behind != '0'
        run: |
          {
            echo "## ❌ Upstream sync FAILED — fork NOT updated"
            echo ""
            echo "Merge conflict or red tests. \`main\` was left unchanged; investigate before deploying."
          } >> "$GITHUB_STEP_SUMMARY"
