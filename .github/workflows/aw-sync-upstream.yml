name: AW Sync Upstream

# GitHub cannot trigger a workflow from another repo's release, so poll: each
# run finds the newest upstream release tag not yet in main, merges it into
# sync/upstream and opens (or updates) a PR into main with chad-aw as reviewer.
# Merges the PR itself only when clean (no conflicts, no skipped workflow
# changes, lint and tests green). Deploys to Cloud Run stay manual.

on:
  schedule:
    - cron: "0 13 * * *" # daily 13:00 UTC (~9am ET)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: aw-sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Merge newest upstream release and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The script adds an `upstream` remote; pin gh to this fork so it never targets upstream.
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/aw-sync-upstream.sh
